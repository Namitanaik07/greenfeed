spring.application.name=appraisalSystem
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appraisalsystem}
spring.datasource.username=${DB_USERNAME:appraisalsystemdb}
spring.datasource.password=${DB_PASSWORD:ASMDB}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:5465431654dsf4sdfvdsf4vs8d74fv5ds6f4v9ds4f9ds4fds65f4d6s5fv4df}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG

# HikariCP Configuration (For high concurrency)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# File Upload Constraints
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.schemas=public
spring.flyway.default-schema=public

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true